  <title>Shop Track - Retail Inventory OS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 38%, #0C5540 0%, #06382A 60%, #032118 100%);
      color: #FFFFFF;
      z-index: 999999;
      transition: opacity 0.35s ease-out, transform 0.35s ease-out;
      user-select: none;
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 24px;
      max-width: 320px;
    }

    .logo-badge {
      width: 96px;
      height: 96px;
      border-radius: 26px;
      background: #FFFFFF;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 0 1.5px rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      position: relative;
      animation: float-pulse 3s infinite ease-in-out;
      overflow: hidden;
    }

    .logo-badge::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.5), rgba(245, 158, 11, 0.3));
      z-index: -1;
      opacity: 0.8;
    }

    .app-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 26px;
    }

    .loader-title {
      margin: 0 0 6px 0;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #FFFFFF;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .loader-subtitle {
      margin: 0 0 24px 0;
      font-size: 13px;
      color: #A7F3D0;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* Modern Dual Ring Spinner */
    .spinner-box {
      position: relative;
      width: 44px;
      height: 44px;
      margin-bottom: 16px;
    }

    .spinner-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #34D399;
      border-right-color: #F59E0B;
      animation: spin 0.85s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }

    /* Progress pill */
    .progress-track {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, #34D399, #F59E0B);
      border-radius: 999px;
      animation: progress-slide 1.4s infinite ease-in-out;
    }

    .loader-footnote {
      margin-top: 14px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 500;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes float-pulse {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-5px) scale(1.03);
      }
    }

    @keyframes progress-slide {
      0% {
        left: -40%;
      }
      50% {
        left: 40%;
      }
      100% {
        left: 100%;
      }
    }
  </style>

      </div>

      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>

      <span class="loader-footnote">Loading offline catalogue...</span>
    </div>
  </div>

  <script>
    function dismissLoader() {
      const loader = document.getElementById('app-loader');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        loader.style.transform = 'scale(1.02)';
        loader.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 380);
      }
    }
    window.addEventListener('flutter-first-frame', dismissLoader);
    // Safety fallback in case flutter-first-frame event is delayed
    setTimeout(dismissLoader, 3500);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
